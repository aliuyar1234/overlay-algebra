[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overlay-algebra"
version = "0.1.0a0"
description = "Research scaffold for Overlay Algebra"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "spacy>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.tmp_pytest"
