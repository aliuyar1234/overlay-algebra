<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1: Single-Overlay Recovery</title>
  <desc id="desc">Grouped horizontal bars comparing prompt-only, direct, and SOAR systems on J and Q primary metrics and answer F1.</desc>
  <style>
    .title { font: 700 22px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 13px Arial, sans-serif; fill: #4b5563; }
    .label { font: 13px Arial, sans-serif; fill: #111827; }
    .axis { font: 12px Arial, sans-serif; fill: #374151; }
    .value { font: 12px Arial, sans-serif; fill: #111827; }
    .legend { font: 12px Arial, sans-serif; fill: #111827; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .frame { stroke: #d1d5db; stroke-width: 1; fill: none; }
    .prompt { fill: #9ca3af; }
    .direct { fill: #2563eb; }
    .soar { fill: #059669; }
  </style>

  <rect width="860" height="520" fill="#ffffff"/>
  <text x="36" y="38" class="title">Figure 1. Corrected Full-Scale Single-Overlay Recovery</text>
  <text x="36" y="60" class="subtitle">Prompt-only is near zero under the operational contract, while SOAR overlaps with the direct single-overlay adapter.</text>

  <rect x="170" y="90" width="560" height="340" class="frame"/>

  <line x1="170" y1="90" x2="170" y2="430" class="grid"/>
  <line x1="310" y1="90" x2="310" y2="430" class="grid"/>
  <line x1="450" y1="90" x2="450" y2="430" class="grid"/>
  <line x1="590" y1="90" x2="590" y2="430" class="grid"/>
  <line x1="730" y1="90" x2="730" y2="430" class="grid"/>

  <text x="170" y="448" class="axis">0.00</text>
  <text x="303" y="448" class="axis">0.25</text>
  <text x="443" y="448" class="axis">0.50</text>
  <text x="583" y="448" class="axis">0.75</text>
  <text x="723" y="448" class="axis">1.00</text>

  <text x="36" y="125" class="label">J primary</text>
  <text x="36" y="205" class="label">Q primary</text>
  <text x="36" y="285" class="label">J answer F1</text>
  <text x="36" y="365" class="label">Q answer F1</text>

  <text x="108" y="118" class="axis">Prompt</text>
  <text x="108" y="134" class="axis">Direct</text>
  <text x="108" y="150" class="axis">SOAR</text>
  <text x="108" y="198" class="axis">Prompt</text>
  <text x="108" y="214" class="axis">Direct</text>
  <text x="108" y="230" class="axis">SOAR</text>
  <text x="108" y="278" class="axis">Prompt</text>
  <text x="108" y="294" class="axis">Direct</text>
  <text x="108" y="310" class="axis">SOAR</text>
  <text x="108" y="358" class="axis">Prompt</text>
  <text x="108" y="374" class="axis">Direct</text>
  <text x="108" y="390" class="axis">SOAR</text>

  <rect x="170" y="110" width="0" height="10" class="prompt"/>
  <rect x="170" y="126" width="559" height="10" class="direct"/>
  <rect x="170" y="142" width="559" height="10" class="soar"/>
  <text x="178" y="119" class="value">0.0000</text>
  <text x="736" y="135" class="value">0.9986</text>
  <text x="736" y="151" class="value">0.9986</text>

  <rect x="170" y="190" width="0" height="10" class="prompt"/>
  <rect x="170" y="206" width="527" height="10" class="direct"/>
  <rect x="170" y="222" width="527" height="10" class="soar"/>
  <text x="178" y="199" class="value">0.0000</text>
  <text x="704" y="215" class="value">0.9413</text>
  <text x="704" y="231" class="value">0.9414</text>

  <rect x="170" y="270" width="0" height="10" class="prompt"/>
  <rect x="170" y="286" width="467" height="10" class="direct"/>
  <rect x="170" y="302" width="467" height="10" class="soar"/>
  <text x="178" y="279" class="value">0.0000</text>
  <text x="644" y="295" class="value">0.8346</text>
  <text x="644" y="311" class="value">0.8344</text>

  <rect x="170" y="350" width="0" height="10" class="prompt"/>
  <rect x="170" y="366" width="455" height="10" class="direct"/>
  <rect x="170" y="382" width="455" height="10" class="soar"/>
  <text x="178" y="359" class="value">0.0000</text>
  <text x="632" y="375" class="value">0.8121</text>
  <text x="632" y="391" class="value">0.8122</text>

  <rect x="570" y="32" width="12" height="12" class="prompt"/>
  <text x="588" y="42" class="legend">Prompt-only</text>
  <rect x="672" y="32" width="12" height="12" class="direct"/>
  <text x="690" y="42" class="legend">Direct</text>
  <rect x="750" y="32" width="12" height="12" class="soar"/>
  <text x="768" y="42" class="legend">SOAR</text>
</svg>
