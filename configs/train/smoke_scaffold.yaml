experiment_name: smoke_scaffold
milestone: M2
command: overlay_algebra.train.fit
seed: 17
notes: Tiny M2 smoke run for the semantic scaffold adapter on the bundled processed fixture shard.
paths:
  train_dataset: data/processed/squad_jcq_v1_fixture/train.jsonl
  eval_dataset: data/processed/squad_jcq_v1_fixture/val.jsonl
payload:
  base_model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  local_files_only: true
  condition: plain
  target_modules:
    - o_proj
    - down_proj
  lora_rank: 16
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 0.0001
  train_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 1
  max_length: 192
  max_new_tokens: 24
  max_train_examples: 1
  max_eval_examples: 1
  checkpoint_interval_optimizer_steps: 250
  heartbeat_interval_seconds: 30
  control_poll_seconds: 5
  max_checkpoints_to_keep: 3
  device: cuda
  torch_dtype: bf16
