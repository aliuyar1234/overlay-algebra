      merge_metrics: runs/oa_m5_full_merge_jq_eval_17/metrics.json
      soar_metrics: runs/oa_m5_full_soar_jq_eval_17/metrics.json
      direct_metrics: runs/oa_m5_full_direct_jq_eval_17/metrics.json
    - condition: CQ
      active_overlays: [C, Q]
      prompt_only_metrics: runs/oa_m5_full_prompt_only_cq_eval_17/metrics.json
