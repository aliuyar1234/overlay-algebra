experiment_name: full_pairs
milestone: M5
command: overlay_algebra.analysis.compose
seed: 17
notes: Full-data M5 pair composition tuning for SOAR and tuned merge baselines.
paths:
  scaffold_adapter: runs/oa_m4_full_scaffold_17/adapter
  eval_dataset: data/processed/squad_jcq_v1/val.jsonl
  feature_cache_dir: data/processed/squad_jcq_v1/_feature_cache
  residual_adapter_J: runs/oa_m4_full_residualize_j_17/residual_adapter
  residual_adapter_C: runs/oa_m4_full_residualize_c_17/residual_adapter
  residual_adapter_Q: runs/oa_m4_full_residualize_q_17/residual_adapter
  direct_adapter_J: runs/oa_m4_full_j_17/adapter
  direct_adapter_C: runs/oa_m4_full_c_17/adapter
  direct_adapter_Q: runs/oa_m4_full_q_17/adapter
payload:
  base_model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  local_files_only: true
  compositions:
    - condition: JC
      active_overlays: [J, C]
      max_new_tokens: 64
    - condition: JQ
      active_overlays: [J, Q]
      max_new_tokens: 96
    - condition: CQ
      active_overlays: [C, Q]
      max_new_tokens: 96
  alpha_grid: [0.5, 0.75, 1.0, 1.25]
  merge_grid_step: 0.25
  merge_search_policy: match_soar_budget
  semantic_guardrail_points: 3.0
  max_length: 768
  max_eval_examples: 9353
  eval_batch_size: 4
  reuse_feature_cache: true
  sort_eval_by_length: true
  enforce_budget_parity: true
  budget_parity_tolerance: 0
  synthesized_lora_dropout: 0.0
  checkpoint_interval_units: 5
  heartbeat_interval_seconds: 30
  control_poll_seconds: 5
  max_checkpoints_to_keep: 3
  device: cuda
  torch_dtype: bf16
